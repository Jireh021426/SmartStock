
# SmartStock isolated test environment

spring.application.name=SmartStock-Test

# In-memory database: never use production records
spring.datasource.url=jdbc:h2:mem:smartstock_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test-only schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable unnecessary logging
spring.thymeleaf.cache=false
logging.level.org.springframework.web=WARN
logging.level.org.thymeleaf=WARN
logging.level.com.smartstock=INFO

# Avoid port conflicts
server.port=0
