
# ========================================
# SMARTSTOCK AUTOMATED TEST CONFIGURATION
# ========================================

spring.application.name=SmartStock-Test

# Isolated in-memory database.
# Never connect automated tests to production H2.
spring.datasource.url=jdbc:h2:mem:smartstock_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create test tables automatically.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable the legacy startup migration in tests.
spring.autoconfigure.exclude=

# Keep test output manageable.
spring.thymeleaf.cache=false
logging.level.org.springframework.web=WARN
logging.level.org.thymeleaf=WARN
logging.level.com.smartstock=INFO
