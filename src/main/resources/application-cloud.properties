
# ==========================================
# SMARTSTOCK - RAILWAY CLOUD CONFIGURATION
# ==========================================

spring.application.name=SmartStock

# PostgreSQL database connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Validate the database schema.
# Do not automatically create or modify tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Disable legacy inventory migration.
smartstock.migration.enabled=false

# Railway supplies the application port.
server.port=${PORT:8080}
server.address=0.0.0.0

# Production settings
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-binding-errors=never

# Honor HTTPS forwarded headers from the hosting proxy.
server.forward-headers-strategy=framework

# Secure cookies when accessed over HTTPS.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.thymeleaf=WARN
logging.level.com.smartstock=INFO
