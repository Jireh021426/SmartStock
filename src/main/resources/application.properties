spring.application.name=SmartStock
# New database so the original Phase 1 integer-stock database remains untouched.
spring.datasource.url=jdbc:h2:file:./data/smartstock-chicken-phase3
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.org.springframework.web=INFO
logging.level.org.thymeleaf=INFO
logging.level.com.smartstock=INFO