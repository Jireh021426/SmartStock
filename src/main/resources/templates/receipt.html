<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStock | Sale Receipt</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments/navigation :: siteHeader}"></header><main><div class="narrow"><a href="/sales">← Sales</a><h2>Sale Receipt</h2><div class="panel receipt"><h2>SmartStock</h2><p>Fresh Chicken Business — Demo Receipt</p><hr><p><b>Receipt #:</b> <span th:text="${sale.id}"></span></p><p><b>Date:</b> <span th:text="${#temporals.format(sale.soldAt,'yyyy-MM-dd HH:mm:ss')}"></span></p><p><b>Product:</b> <span th:text="${sale.productName}"></span></p><p><b>Weight:</b> <span th:text="${sale.weightKg} + ' kg'"></span></p><p><b>Price per kg:</b> <span th:text="'₱' + ${sale.pricePerKg}"></span></p><hr><h2 th:text="'TOTAL: ₱' + ${sale.total}"></h2><p><b>Payment:</b> <span th:text="${sale.paymentMethod}"></span></p><p th:if="${sale.customer != null}"><b>Customer:</b> <span th:text="${sale.customer.name}"></span></p><p th:if="${sale.paymentMethod == T(com.smartstock.model.PaymentMethod).CREDIT}"><b>Status:</b> Recorded as utang, not collected cash</p><button class="button no-print" onclick="window.print()">Print Receipt</button></div></div></main></body></html>
