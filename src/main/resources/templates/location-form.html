
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>SmartStock | Location Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/navigation :: siteHeader}"></header>

<main>
    <div class="narrow">

        <a th:href="@{/locations}">
            ← Stock Locations
        </a>

        <h2 th:text="${editing ? 'Edit Stock Location' : 'Add Stock Location'}">
            Stock Location
        </h2>

        <div class="panel">

            <p class="error"
               th:if="${error}"
               th:text="${error}"></p>

            <form th:object="${locationForm}"
                  th:action="${editing}
                    ? @{/locations/{id}/save(id=${locationId})}
                    : @{/locations/save}"
                  method="post">

                <label for="code">Location Code</label>
                <input id="code"
                       type="text"
                       th:field="*{code}"
                       maxlength="30"
                       placeholder="e.g. CARBON_A"
                       required>

                <small class="error"
                       th:if="${#fields.hasErrors('code')}"
                       th:errors="*{code}"></small>

                <label for="name">Location Name</label>
                <input id="name"
                       type="text"
                       th:field="*{name}"
                       maxlength="100"
                       placeholder="e.g. Carbon Stall A"
                       required>

                <small class="error"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"></small>

                <label for="locationType">Location Type</label>
                <select id="locationType"
                        th:field="*{locationType}"
                        required>
                    <option value="STALL">Chicken Stall</option>
                    <option value="STORAGE">Storage</option>
                </select>

                <small class="error"
                       th:if="${#fields.hasErrors('locationType')}"
                       th:errors="*{locationType}"></small>

                <p>
                    Location codes must be unique.
                    Existing historical transactions
                    remain associated with their location.
                </p>

                <button class="button"
                        type="submit"
                        th:text="${editing ? 'Save Changes' : 'Create Location'}">
                    Save
                </button>

            </form>

        </div>
    </div>
</main>

</body>
</html>
