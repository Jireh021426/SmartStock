<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="siteHeader">
    <!-- SVG SPRITE (Keep your existing sprite here, I've truncated it for brevity) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <!-- Include all your <symbol> definitions here -->
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></symbol>
        <!-- ... -->
    </svg>

    <!-- Sidebar Container -->
    <div class="sidebar">
        
        <!-- Brand -->
        <div class="brand">
            <span class="brand-mark" style="background: #0d9488; color: white;">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>
            </span>
            <div class="brand-text">
                <h1 style="color: #0f172a;">SmartStock</h1>
                <span style="color: #64748b;">Chicken Stall &amp; Storage</span>
            </div>
        </div>

        <!-- Nav Links -->
        <nav>
            <a th:if="${nav.admin or nav.manager}" th:href="@{/dashboard}">
                <svg class="ico"><use href="#i-grid"/></svg> <span>Dashboard</span>
            </a>

            <div class="nav-label">Inventory</div>
            <a th:href="@{/products}"><svg class="ico"><use href="#i-box"/></svg> <span>Products</span></a>
            <a th:if="${nav.admin or nav.manager or nav.auditor or nav.sender or nav.receiver}" th:href="@{/inventory}">
                <svg class="ico"><use href="#i-clock"/></svg> <span>Stock History</span>
            </a>
            <a th:if="${nav.admin}" th:href="@{/inventory/new}"><svg class="ico"><use href="#i-swap"/></svg> <span>Stock In/Out</span></a>
            <a th:if="${nav.canViewLocations}" th:href="@{/locations}"><svg class="ico"><use href="#i-pin"/></svg> <span>Locations</span></a>
            <a th:if="${nav.canViewTransfers}" th:href="@{/transfers}"><svg class="ico"><use href="#i-truck"/></svg> <span>Transfers</span></a>
            <a th:if="${nav.canViewAudits}" th:href="@{/audits}"><svg class="ico"><use href="#i-clipboard"/></svg> <span>Audits</span></a>

            <div class="nav-label" th:if="${nav.admin or nav.manager or nav.cashier or nav.auditor or nav.canViewRemittances}">Sales</div>
            <a th:if="${nav.admin or nav.manager or nav.cashier or nav.auditor}" th:href="@{/sales}">
                <svg class="ico"><use href="#i-receipt"/></svg> <span>Sales</span>
            </a>
            <a th:if="${nav.cashier}" th:href="@{/sales/new}"><svg class="ico"><use href="#i-cart"/></svg> <span>New Sale</span></a>
            <a th:if="${nav.admin or nav.manager or nav.cashier or nav.auditor}" th:href="@{/customers}">
                <svg class="ico"><use href="#i-users"/></svg> <span>Customers / Utang</span>
            </a>

            <div class="nav-label" th:if="${nav.admin}">Admin</div>
            <a th:if="${nav.admin}" th:href="@{/employees}"><svg class="ico"><use href="#i-briefcase"/></svg> <span>Employees</span></a>
        </nav>
    </div>

    <!-- Topbar (Search / Profile) -->
    <div class="smart-topbar">
        <div class="topbar-search" style="background: #ffffff; border-color: #e2e8f0;">
            <svg class="ico" style="color: #64748b;"><use href="#i-search"/></svg>
            <input id="smartstock-nav-search" type="search" placeholder="Search pages..." style="color: #0f172a; background: transparent;" />
        </div>
        <div class="topbar-right">
            <details class="topbar-profile">
                <summary style="background: #ffffff; border-color: #e2e8f0; color: #0f172a;">
                    <span class="topbar-avatar" style="color: #0d9488;"><svg class="ico"><use href="#i-users"/></svg></span>
                    <span class="topbar-profile-label" th:text="${currentUsername}">Account</span>
                </summary>
                <div class="topbar-profile-menu" style="background: #ffffff; border-color: #e2e8f0;">
                    <strong th:text="${currentUsername}" style="color: #0f172a;">Account</strong>
                    <span class="topbar-profile-role" style="color: #64748b;">Administrator</span>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" style="background: #fef2f2; color: #b91c1c;">Log out</button>
                    </form>
                </div>
            </details>
        </div>
    </div>

    <!-- Sidebar Active Link Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll(".sidebar nav a");
            let activeLink = null;

            links.forEach(function (link) {
                const linkPath = new URL(link.href).pathname;
                if (currentPath === linkPath) {
                    activeLink = link;
                } else if (currentPath.startsWith(linkPath + "/") && (!activeLink || linkPath.length > new URL(activeLink.href).pathname.length)) {
                    activeLink = link;
                }
            });

            if (activeLink) {
                activeLink.classList.add("active");
            }
        });
    </script>
</header>

</body>
</html>
