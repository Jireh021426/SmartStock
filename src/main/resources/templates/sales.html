<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStock | Sales</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments/navigation :: siteHeader}"></header><main><div class="heading"><div><h2>Sales Management</h2><p>Cash, GCash and utang. Sales and collections are tracked separately.</p></div><a class="button" href="/sales/new">+ New Sale</a></div><div class="stats triple"><div class="panel"><small>Today's sales (including utang)</small><h2 th:text="'₱' + ${todaySales}"></h2></div><div class="panel"><small>Today's money collected</small><h2 th:text="'₱' + ${todayCollected}"></h2></div><div class="panel"><small>Total unpaid utang</small><h2 th:text="'₱' + ${outstanding}"></h2></div></div><div class="panel"><h3>Sales History</h3><table><thead><tr><th>Sale #</th><th>Time</th><th>Product</th><th>Weight</th><th>Price/kg</th><th>Total</th><th>Method</th><th>Customer</th><th>Receipt</th></tr></thead><tbody><tr th:each="s:${sales}"><td th:text="${s.id}"></td><td th:text="${#temporals.format(s.soldAt,'yyyy-MM-dd HH:mm')}"></td><td th:text="${s.productName}"></td><td th:text="${s.weightKg} + ' kg'"></td><td th:text="'₱' + ${s.pricePerKg}"></td><td th:text="'₱' + ${s.total}"></td><td th:text="${s.paymentMethod}"></td><td th:text="${s.customer != null ? s.customer.name : 'Walk-in'}"></td><td><a th:href="@{/sales/{id}(id=${s.id})}">View</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="9" class="empty">No sales recorded yet.</td></tr></tbody></table></div></main></body></html>
