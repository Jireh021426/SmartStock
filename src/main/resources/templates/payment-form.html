<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStock | Record Utang Payment</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments/navigation :: siteHeader}"></header><main><div class="narrow"><a href="/customers">← Customers</a><h2>Record Utang Repayment</h2><div class="panel"><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/payments/save}" th:object="${paymentForm}" method="post"><input type="hidden" th:field="*{requestId}"><label>Customer<select th:field="*{customerId}" required><option value="">Select customer</option><option th:each="c:${customers}" th:value="${c.id}" th:text="${c.name + ' | balance: ₱' + c.balance}"></option></select></label><small th:errors="*{customerId}"></small><label>Payment amount (₱)<input type="number" min="0.01" step="0.01" th:field="*{amount}" required></label><small th:errors="*{amount}"></small><label>Received via<select th:field="*{method}"><option value="CASH">Cash</option><option value="GCASH">GCash</option></select></label><p>Payment cannot exceed the customer's unpaid balance.</p><button class="button" type="submit">Record Payment</button></form></div></div></main></body></html>
