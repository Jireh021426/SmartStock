<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartStock | Employees</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/employees.css(v=reference-1)}">
    <script th:src="@{/js/theme.js}"></script>
</head>

<body>

<header th:replace="~{fragments/navigation :: siteHeader}"></header>

<main class="employees-page">

    <!-- Screenshot-inspired page heading. Shared SmartStock navigation remains untouched. -->
    <div class="topbar employee-hero">
        <div class="employee-hero-heading">
            <svg class="employee-hero-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                <circle cx="16" cy="9" r="5" fill="currentColor"/>
                <path d="M7.5 24.8c0-5.5 3.6-9 8.5-9s8.5 3.5 8.5 9v1.7h-17z" fill="currentColor"/>
                <circle cx="5.5" cy="12" r="3.5" fill="currentColor" opacity=".72"/>
                <path d="M.8 23c0-4.1 2.1-7 5.1-7 1.3 0 2.3.4 3.2 1.1-1.3 1.9-2 4.3-2 7.2H.8z" fill="currentColor" opacity=".72"/>
                <circle cx="26.5" cy="12" r="3.5" fill="currentColor" opacity=".72"/>
                <path d="M31.2 23c0-4.1-2.1-7-5.1-7-1.3 0-2.3.4-3.2 1.1 1.3 1.9 2 4.3 2 7.2h6.3z" fill="currentColor" opacity=".72"/>
            </svg>
            <h2 class="page-title">Employees</h2>
        </div>
        <div class="employee-account-pill" aria-label="Signed-in user">
            <span class="employee-account-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4.2 20c0-4.8 3.4-7.6 7.8-7.6s7.8 2.8 7.8 7.6" fill="currentColor"/></svg>
            </span>
            <span th:text="${currentUsername}">Admin</span>
        </div>
    </div>

    <!-- Notices stay outside of the form so status and validation remain visible. -->
    <p class="error-msg" th:if="${error}" th:text="${error}"></p>
    <p class="notice-msg" th:if="${notice}" th:text="${notice}"></p>

    <section class="panel employee-create-panel" aria-labelledby="employee-create-title">
        <div class="panel-head employee-create-heading">
            <span class="employee-add-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/></svg>
            </span>
            <h3 id="employee-create-title">Add Employee</h3>
        </div>

        <form class="nova-form employee-create-form" th:action="@{/employees/create}" method="post" id="employee-create-form">
            <div class="form-grid employee-reference-grid">
                <label for="employee-full-name">
                    <span class="employee-field-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.1" r="4.2" fill="currentColor"/><path d="M3.7 20.5v-1.1c0-4.2 3.5-7.5 8.3-7.5s8.3 3.3 8.3 7.5v1.1z" fill="currentColor"/></svg>
                        Name
                    </span>
                    <input id="employee-full-name" type="text" name="fullName" maxlength="100" placeholder="e.g. Juan Dela Cruz" autocomplete="name" required>
                </label>

                <label for="employee-username">
                    <span class="employee-field-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.1" r="4.2" fill="currentColor"/><path d="M3.7 20.5v-1.1c0-4.2 3.5-7.5 8.3-7.5s8.3 3.3 8.3 7.5v1.1z" fill="currentColor"/></svg>
                        Username
                    </span>
                    <input id="employee-username" type="text" name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+" autocomplete="off" placeholder="e.g. juan.dela" required>
                </label>

                <div class="employee-password-field">
                    <label for="employee-password" class="employee-password-label">
                    <span class="employee-field-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11.5" rx="2.5" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="15.5" r="1.3" fill="#fff"/></svg>
                        Password
                    </span>
                    </label>
                    <span class="employee-password-wrap">
                        <input id="employee-password" type="password" name="password" minlength="12" maxlength="72" autocomplete="new-password" placeholder="Min 12 chars" required>
                        <button class="employee-password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="employee-password" title="Show password">
                            <svg class="eye-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                            <svg class="eye-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.4 6.1A11.9 11.9 0 0 1 12 6c6.4 0 10 6 10 6a13.5 13.5 0 0 1-3.5 3.6M6.2 7.4C3.5 9.3 2 12 2 12s3.6 6 10 6c1.6 0 3-.4 4.3-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 10a3 3 0 0 0 4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                        </button>
                    </span>
                </div>

                <label for="employee-role">
                    <span class="employee-field-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" fill="currentColor"/><rect x="8" y="3" width="8" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 12h20M10 12v2.5h4V12" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
                        Role
                    </span>
                    <select id="employee-role" name="role" required>
                        <option value="">Select Role</option>
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                    </select>
                </label>

                <label class="full-width" for="employee-location">
                    <span class="employee-field-label">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c-2.2-3.3-8-9.4-8-14A8 8 0 1 1 20 8c0 4.6-5.8 10.7-8 14z" fill="currentColor"/><circle cx="12" cy="8.3" r="2.6" fill="#fff"/></svg>
                        Location
                    </span>
                    <select id="employee-location" name="locationId" aria-describedby="employee-location-hint">
                        <option value="">None</option>
                        <option th:each="location : ${locations}" th:value="${location.id}"
                                th:text="${location.name + ' (' + location.code + ')'}"></option>
                    </select>
                </label>
            </div>

            <p class="form-hint" id="employee-location-hint">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M12 10.5v5M12 7.5h.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
                Assigned location is required for Sender, Receiver, and Cashier roles.
            </p>

            <div class="form-actions employee-create-actions">
                <button class="btn employee-cancel-button" type="reset">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 .8 5.4M4 5v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Cancel
                </button>
                <button class="btn btn-primary employee-submit-button" type="submit">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                    Create
                </button>
            </div>
        </form>
    </section>

    <!-- Employee List -->
    <div class="panel">
        <div class="panel-head">
            <h3>Registered Employees</h3>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Assigned Location</th>
                        <th>Status</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="employee : ${employees}">
                        <td class="text-muted" th:text="${employee.id}"></td>

                        <td class="product-name"
                            th:text="${employee.fullName}"></td>

                        <td class="text-muted"
                            th:text="${employee.username}"></td>

                        <td>
                            <span class="role-badge"
                                  th:text="${employee.role}"></span>
                        </td>

                        <td th:text="${employee.assignedLocation != null ? employee.assignedLocation.name : 'Not Assigned'}"
                            th:classappend="${employee.assignedLocation == null} ? 'text-muted' : ''">
                        </td>

                        <td>
                            <span class="status-badge"
                                  th:classappend="${employee.active} ? 'status-active' : 'status-inactive'"
                                  th:text="${employee.active ? 'ACTIVE' : 'INACTIVE'}">
                            </span>
                        </td>

                        <td style="text-align: right;">
                            <form th:if="${employee.active}"
                                  th:action="@{/employees/deactivate}"
                                  method="post"
                                  class="employee-status-form"
                                  style="display:inline;">

                                <input type="hidden"
                                       name="employeeId"
                                       th:value="${employee.id}">
                                <input type="hidden" name="page" th:value="${currentPage}">
                                <input type="hidden" name="size" th:value="${pageSize}">

                                <button type="submit"
                                        class="btn-action btn-deactivate">
                                    Deactivate
                                </button>
                            </form>

                            <form th:unless="${employee.active}"
                                  th:action="@{/employees/activate}"
                                  method="post"
                                  class="employee-status-form"
                                  style="display:inline;">

                                <input type="hidden"
                                       name="employeeId"
                                       th:value="${employee.id}">
                                <input type="hidden" name="page" th:value="${currentPage}">
                                <input type="hidden" name="size" th:value="${pageSize}">

                                <button type="submit"
                                        class="btn-action btn-activate">
                                    Activate
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="7" class="empty-state">
                            No employee accounts found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Server-side employee pagination. The controller fetches one page only. -->
        <nav class="employees-pagination" aria-label="Employee pages" th:if="${totalPages > 0}">
            <div class="pagination-info">
                Showing <strong th:text="${showingStart}">1</strong>
                to <strong th:text="${showingEnd}">10</strong>
                of <strong th:text="${totalEmployees}">10</strong> employees
            </div>
            <div class="pagination-controls">
                <form method="get" th:action="@{/employees}" class="pagination-size-form">
                    <label for="employee-page-size">Rows per page</label>
                    <select id="employee-page-size" name="size" onchange="this.form.submit()" class="select">
                        <option th:each="option : ${pageSizes}"
                                th:value="${option}" th:text="${option}"
                                th:selected="${option == pageSize}">10</option>
                    </select>
                </form>

                <a th:if="${currentPage > 0}" th:href="@{/employees(page=0,size=${pageSize})}" class="page-button">First</a>
                <a th:if="${currentPage > 0}" th:href="@{/employees(page=${currentPage - 1},size=${pageSize})}" class="page-button">Previous</a>
                <span th:unless="${currentPage > 0}" class="page-button disabled">Previous</span>

                <a th:each="pageNumber : ${pageNumbers}"
                   th:href="@{/employees(page=${pageNumber},size=${pageSize})}"
                   th:text="${pageNumber + 1}"
                   th:classappend="${pageNumber == currentPage} ? ' active' : ''"
                   class="page-button">1</a>

                <a th:if="${currentPage < totalPages - 1}" th:href="@{/employees(page=${currentPage + 1},size=${pageSize})}" class="page-button">Next</a>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/employees(page=${totalPages - 1},size=${pageSize})}" class="page-button">Last</a>
                <span th:unless="${currentPage < totalPages - 1}" class="page-button disabled">Next</span>
            </div>
        </nav>
    </div>

</main>

<script>
(function () {
    'use strict';
    const form = document.getElementById('employee-create-form');
    if (!form) return;
    const password = document.getElementById('employee-password');
    const toggle = form.querySelector('.employee-password-toggle');
    const role = document.getElementById('employee-role');
    const location = document.getElementById('employee-location');
    const rolesRequiringLocation = new Set(['SENDER', 'RECEIVER', 'CASHIER']);
    function updateLocationRequirement() {
        location.required = rolesRequiringLocation.has(role.value);
    }
    function hidePassword() {
        password.type = 'password';
        toggle.setAttribute('aria-pressed', 'false');
        toggle.setAttribute('aria-label', 'Show password');
        toggle.title = 'Show password';
    }
    toggle.addEventListener('click', function () {
        if (password.type === 'password') {
            password.type = 'text';
            toggle.setAttribute('aria-pressed', 'true');
            toggle.setAttribute('aria-label', 'Hide password');
            toggle.title = 'Hide password';
        } else hidePassword();
    });
    role.addEventListener('change', updateLocationRequirement);
    form.addEventListener('reset', function () {
        hidePassword();
        // The browser restores select values after the reset event.
        setTimeout(updateLocationRequirement, 0);
    });
    updateLocationRequirement();
})();
</script>

</body>
</html>
