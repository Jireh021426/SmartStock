<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartStock | Sign in</title>
    
    <!-- Global Styles & Theme Engine -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/gentelella-dark.css(v=2)}">
    
    <!-- Load theme.js FIRST so it can set the initial theme without flashing -->
    <script th:src="@{/js/theme.js}"></script>

    <!-- Anti-flash snippet to apply theme before page renders -->
    <script>
        (function() {
            const saved = localStorage.getItem("smartstock-theme");
            if (saved === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
</head>
<body class="login-body">

<div class="login-card">
    
    <!-- Theme Toggle Button (Hooked into theme.js) -->
    <button type="button" class="theme-toggle" data-theme-toggle>
        <!-- Sun icon (shown in dark mode) -->
        <svg class="theme-icon-sun ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="theme-icon-moon ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <!-- Brand -->
    <div class="login-brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>
        </div>
        <div>
            <h1>SmartStock</h1>
            <span>Chicken Stall &amp; Storage</span>
        </div>
    </div>

    <h2>Welcome back</h2>
    <p class="login-sub">Please enter your details to sign in.</p>

    <!-- Alerts -->
    <p class="error-msg" th:if="${param.error}">Invalid username or password.</p>
    <p class="notice-msg" th:if="${param.logout}">You have been logged out.</p>
    <p class="notice-msg" th:each="k : ${param.keySet()}" th:if="${#strings.startsWith(k, 'session')}">
        Your session has ended. Please sign in again.
    </p>

    <!-- Form -->
    <form th:action="@{/login}" method="post" class="login-form">
        <label>
            Username
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input name="username" type="text" autocomplete="username" autofocus required placeholder="Enter username">
            </div>
        </label>

        <label>
            Password
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
            </div>
        </label>

        <button class="btn-login" type="submit">Sign in</button>
    </form>

</div>

</body>
</html>
